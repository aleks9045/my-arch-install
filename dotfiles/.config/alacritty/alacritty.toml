# alacritty.toml

[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml"
]

[cursor]
style = { shape = "Beam", blinking = "Off" }

[env]
TERM = "alacritty"


[window]
decorations = "full"
dynamic_padding = true

[window.padding]
x = 8


[font]
size = 12.0

[font.normal]
family = "JetBrainsMonoNL Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMonoNL Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Bold Italic"
[keyboard]

# Ctrl+C
[[keyboard.bindings]]
key = "C"
mods = "Control"
action = "Copy"

# Russian "с"
[[keyboard.bindings]]
key = "С"
mods = "Control"
action = "Copy"

# Ctrl+Shift+C -> SIGINT
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
chars = "\u0003"

# Ctrl+Shift+С -> SIGINT (Russian)
[[keyboard.bindings]]
key = "С"
mods = "Control|Shift"
chars = "\u0003"


[[keyboard.bindings]]
key = "М"
mods = "Control"
action = "Paste"
