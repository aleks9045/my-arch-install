# Правила окон для Hyprland 0.55.1 (новый синтаксис)

# Плавающие окна
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(nwg-look)$, float on
windowrule = match:class ^(qt5ct)$, float on
windowrule = match:class ^(qt6ct)$, float on
windowrule = match:class ^(wdisplays)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on

# Размер и центрирование для pavucontrol
windowrule = match:class ^(pavucontrol)$, size 800 600, center on

# Плавающее и закреплённое окно для hyprpolkit
windowrule = match:class ^(hyprpolkitagent)$, float on
windowrule = match:class ^(hyprpolkitagent)$, pin on
# Отключение idle для медиаплееров
windowrule = match:class ^(mpv|.+exe|celluloid)$, idle_inhibit focus
windowrule = match:class ^(firefox)$, idle_inhibit fullscreen

# Прозрачность
windowrule = match:class ^(kitty)$, opacity 0.92 0.92
