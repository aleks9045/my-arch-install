# Hyprland Main Configuration
# Модульная структура конфигурации

# Переменные окружения
source = ~/.config/hypr/conf/environment.conf

# Мониторы
source = ~/.config/hypr/conf/monitor.conf

# Общие настройки
source = ~/.config/hypr/conf/general.conf

# Декорации
source = ~/.config/hypr/conf/decoration.conf

# Анимации
source = ~/.config/hypr/conf/animations.conf

# Устройства ввода
source = ~/.config/hypr/conf/input.conf

# Клавиатура и раскладки
source = ~/.config/hypr/conf/keyboard.conf

# Горячие клавиши
source = ~/.config/hypr/conf/binds.conf

# Правила окон
source = ~/.config/hypr/conf/rules.conf

# Автозапуск
source = ~/.config/hypr/conf/autostart.conf
